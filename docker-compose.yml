services:
  db:
    image: postgres:16-alpine
    container_name: synnex-store-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-synnex_store}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-synnex_store}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: synnex-store-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-synnex_store}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      BASE_URL: ${BASE_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: synnex-store-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
